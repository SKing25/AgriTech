services:
  - type: web
    name: agritech-precision-grupo2
    env: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: APIMETEO_TIMEOUT_S
        value: "5"
      - key: VALVULAS_TIMEOUT_S
        value: "3"
      - key: VALVULAS_MAX_RETRIES
        value: "3"
